<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skull King — Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scoring.css">
</head>
<body class="pirate-bg" data-page="scores">

  <div class="scores-wrapper container py-4">
    <header class="mb-4">
      <a href="index.html" class="btn-pirate btn-pirate-outline btn-pirate-sm mb-3">← Accueil</a>
      <h1 class="logo-title">🏆 Historique des scores</h1>
      <p class="text-muted-custom">Les 10 dernières parties</p>
    </header>

    <div id="history-list" class="history-list" aria-live="polite">
      <p class="text-muted-custom">Chargement…</p>
    </div>

    <button type="button" class="btn-pirate btn-pirate-outline mt-4" id="btn-clear-history" style="display:none;">
      Effacer l'historique
    </button>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script>
  (function () {
    if (window.SKStorage && window.SKStorage.loadHistory().length) {
      $('#btn-clear-history').show().on('click', function () {
        if (confirm('Effacer tout l\'historique ?')) {
          window.SKStorage.clearHistory();
          window.location.reload();
        }
      });
    }
  })();
  </script>
</body>
</html>
